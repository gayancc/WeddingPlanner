name: Build & Deploy to Firebase

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wedding-admin/package-lock.json

      - name: Install dependencies
        working-directory: wedding-admin
        run: npm ci

      - name: Write environment.ts from secrets
        working-directory: wedding-admin
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ALLOWED_ADMIN_EMAILS: ${{ secrets.ALLOWED_ADMIN_EMAILS }}
        run: |
          # Convert comma-separated emails into a JSON array string
          EMAILS_JSON=$(echo "$ALLOWED_ADMIN_EMAILS" | tr ',' '\n' | sed "s/^[[:space:]]*//" | sed "s/[[:space:]]*$//" | awk '{printf "\"%s\",\n", $0}' | sed '$ s/,$//')

          cat > src/environments/environment.ts << EOF
          export const environment = {
            production: true,
            firebase: {
              apiKey: '$FIREBASE_API_KEY',
              authDomain: '$FIREBASE_AUTH_DOMAIN',
              projectId: '$FIREBASE_PROJECT_ID',
              storageBucket: '$FIREBASE_STORAGE_BUCKET',
              messagingSenderId: '$FIREBASE_MESSAGING_SENDER_ID',
              appId: '$FIREBASE_APP_ID',
            },
            emailjs: {
              serviceId: '$EMAILJS_SERVICE_ID',
              templateId: '$EMAILJS_TEMPLATE_ID',
              publicKey: '$EMAILJS_PUBLIC_KEY',
            },
            siteUrl: '$SITE_URL',
            allowedAdminEmails: [
              $EMAILS_JSON
            ] as string[],
          };
          EOF

      - name: Build Angular app
        working-directory: wedding-admin
        run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: wedding-admin
