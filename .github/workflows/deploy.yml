name: Build & Deploy to Firebase

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Write environment.ts from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ALLOWED_ADMIN_EMAILS: ${{ secrets.ALLOWED_ADMIN_EMAILS }}
        run: |
          mkdir -p src/environments

          # Build quoted, comma-separated email list for TypeScript array
          EMAILS_TS=""
          IFS=',' read -ra EMAIL_LIST <<< "$ALLOWED_ADMIN_EMAILS"
          for email in "${EMAIL_LIST[@]}"; do
            trimmed=$(echo "$email" | xargs)
            EMAILS_TS="${EMAILS_TS}  '${trimmed}',\n"
          done

          {
            echo "export const environment = {"
            echo "  production: true,"
            echo "  firebase: {"
            echo "    apiKey: '${FIREBASE_API_KEY}',"
            echo "    authDomain: '${FIREBASE_AUTH_DOMAIN}',"
            echo "    projectId: '${FIREBASE_PROJECT_ID}',"
            echo "    storageBucket: '${FIREBASE_STORAGE_BUCKET}',"
            echo "    messagingSenderId: '${FIREBASE_MESSAGING_SENDER_ID}',"
            echo "    appId: '${FIREBASE_APP_ID}',"
            echo "  },"
            echo "  emailjs: {"
            echo "    serviceId: '${EMAILJS_SERVICE_ID}',"
            echo "    templateId: '${EMAILJS_TEMPLATE_ID}',"
            echo "    publicKey: '${EMAILJS_PUBLIC_KEY}',"
            echo "  },"
            echo "  siteUrl: '${SITE_URL}',"
            echo "  allowedAdminEmails: ["
            printf "$EMAILS_TS"
            echo "  ] as string[],"
            echo "};"
          } > src/environments/environment.ts

          echo "Generated environment.ts:"
          cat src/environments/environment.ts

      - name: Build Angular app
        run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }}
